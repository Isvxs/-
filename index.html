<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>【LIVE】全球矚目：Dino 綠光事件追蹤</title>
    <style>
        :root {
            --news-red: #ff0000;
            --news-yellow: #ffff00;
            --green-glow: #00ff00;
        }

        @keyframes strobe {
            0% { background-color: #000; }
            50% { background-color: #004400; }
            100% { background-color: #000; }
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        @keyframes shake {
            0.1s { transform: translate(2px, 2px); }
            0.2s { transform: translate(-2px, -2px); }
            0.3s { transform: translate(2px, -2px); }
        }

        body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
            font-family: "Oswald", "Microsoft JhengHei", sans-serif;
            overflow: hidden;
            animation: strobe 0.1s infinite;
        }

        /* 新聞頂部：直播標籤 */
        .live-tag {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--news-red);
            padding: 10px 30px;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            box-shadow: 0 0 20px var(--news-red);
            z-index: 10;
        }

        .live-dot {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            margin-right: 15px;
            animation: strobe 0.5s infinite;
        }

        /* 主標題區域 */
        .main-headline {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            border: 5px solid var(--green-glow);
            padding: 20px;
            animation: shake 0.05s infinite;
        }

        .headline-text {
            font-size: 5rem;
            color: var(--news-yellow);
            text-shadow: 3px 3px 0 #000;
            margin: 0;
        }

        #timer {
            font-size: 9rem;
            color: var(--green-glow);
            font-family: 'Courier New', monospace;
            font-weight: 900;
            text-shadow: 0 0 40px var(--green-glow);
        }

        /* 底部跑馬燈 */
        .marquee-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0, 0, 255, 0.8);
            border-top: 5px solid white;
            height: 80px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .marquee-content {
            white-space: nowrap;
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
            animation: marquee 10s linear infinite;
        }

        /* 右側快訊 */
        .side-news {
            position: absolute;
            right: 0;
            top: 20%;
            width: 200px;
            background: rgba(255, 0, 0, 0.7);
            padding: 10px;
            font-size: 1.5rem;
            text-align: center;
        }

    </style>
</head>
<body>

    <div class="live-tag"><div class="live-dot"></div> LIVE 直播中</div>

    <div class="side-news">
        🔥 驚爆：<br>Dino<br>大草原<br>開拓史
    </div>

    <div class="main-headline">
        <p class="headline-text">【快訊】Dino 分手被綠至今：</p>
        <div id="timer">計算中...</div>
        <p style="font-size: 2rem; color: #ff00ff;">#誠實面對 #綠光戰警 #2026慘案</p>
    </div>

    <div class="marquee-container">
        <div class="marquee-content">
            最新的數據顯示 Dino 的綠化程度已達到 100% ... 專家建議：要想生活過得去，頭上總得帶點綠 ... 目前大草原面積持續擴大中 ... 分手日 2026/03/19 確定為 Dino 紀念日 ... 
        </div>
    </div>

    <script>
        // 設定起始時間：2026年3月19日
        const startDate = new Date('2026-03-19T00:00:00');

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;

            if (diff < 0) {
                document.getElementById('timer').innerText = "即將發生...";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            const minutes = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            const seconds = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
            const ms = String(Math.floor((diff % 1000) / 10)).padStart(2, '0');

            document.getElementById('timer').innerHTML = 
                `${days}天 ${hours}:${minutes}:${seconds}.${ms}`;
        }

        setInterval(updateTimer, 30);

        // 隨機抖動效果加強
        setInterval(() => {
            const colors = ['#00ff00', '#ff0000', '#ffff00', '#ffffff'];
            document.getElementById('timer').style.color = colors[Math.floor(Math.random() * colors.length)];
        }, 100);
    </script>
</body>
</html>
