<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>DINO 綠 光 災 厄</title>
    <style>
        :root {
            --green: #00ff00;
            --dark: #000;
        }

        @keyframes bg-rotate {
            from { transform: rotate(0deg) scale(1); }
            to { transform: rotate(360deg) scale(3); }
        }

        @keyframes shake-extreme {
            0% { transform: translate(0,0); filter: hue-rotate(0deg); }
            20% { transform: translate(-10px, 5px); filter: hue-rotate(90deg); }
            40% { transform: translate(10px, -5px); filter: hue-rotate(180deg); }
            60% { transform: translate(-15px, -15px); }
            80% { transform: translate(15px, 15px); }
            100% { transform: translate(0,0); }
        }

        @keyframes invert-flash {
            0% { filter: invert(0); }
            95% { filter: invert(0); }
            96% { filter: invert(1); }
            100% { filter: invert(0); }
        }

        body {
            background-color: var(--dark);
            color: var(--green);
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial Black', "Microsoft JhengHei", sans-serif;
            animation: invert-flash 0.2s infinite;
        }

        /* 旋轉的綠色背景牆 */
        .bg-layer {
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            opacity: 0.15;
            z-index: -1;
            animation: bg-rotate 10s linear infinite;
            font-size: 5rem;
        }

        .main-box {
            text-align: center;
            padding: 40px;
            border: 10px dashed var(--green);
            background: rgba(0,0,0,0.8);
            box-shadow: 0 0 100px var(--green);
            animation: shake-extreme 0.05s infinite;
        }

        .header {
            font-size: 3.5rem;
            text-shadow: 0 0 20px var(--green);
            margin-bottom: 20px;
        }

        #timer {
            font-size: 10rem;
            line-height: 0.9;
            color: #fff;
            text-shadow: 5px 5px 0px #00ff00, -5px -5px 0px #ff0000;
        }

        .footer {
            font-size: 2.5rem;
            background: #fff;
            color: #000;
            margin-top: 30px;
            display: inline-block;
            padding: 0 20px;
        }

        .ms-unit { font-size: 4rem; color: #ff0000; }
    </style>
</head>
<body>

    <div class="bg-layer" id="bg-layer"></div>

    <div class="main-box">
        <div class="header">DINO 綠 帽 突 入</div>
        <div id="timer">Loading...</div>
        <div class="footer">悲 劇 還 在 進 行</div>
    </div>

    <script>
        // 設定起始日：2026年3月19日
        const startDate = new Date('2026-03-19T00:00:00');

        // 生成背景 🦖 牆
        const bgLayer = document.getElementById('bg-layer');
        for(let i=0; i<200; i++) {
            bgLayer.innerHTML += '<div>🦖</div>';
        }

        function update() {
            const now = new Date();
            const diff = now - startDate;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            const minutes = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            const seconds = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
            const ms = String(Math.floor((diff % 1000) / 10)).padStart(2, '0');

            document.getElementById('timer').innerHTML = 
                `${days}D<br>${hours}:${minutes}:${seconds}<span class="ms-unit">.${ms}</span>`;
        }

        // 極速刷新
        setInterval(update, 16); // 接近 60fps 的刷新率

        // 隨機改變標題內容
        const titles = ["綠光籠罩", "DINO 堅強", "要想生活過得去", "帽不可擋", "大草原之主"];
        setInterval(() => {
            document.querySelector('.header').innerText = titles[Math.floor(Math.random()*titles.length)];
        }, 500);
    </script>
</body>
</html>
