<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Dino 終極綠光計時器</title>
    <style>
        @keyframes flash {
            0% { background-color: #000; }
            50% { background-color: #003300; }
            100% { background-color: #000; }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        @keyframes pulse {
            0% { scale: 1; }
            50% { scale: 1.2; color: #00ff00; }
            100% { scale: 1; }
        }

        body {
            background-color: #000;
            color: #00ff00;
            overflow: hidden; /* 防止彈幕導致捲軸 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Impact", "Microsoft JhengHei", sans-serif;
            animation: flash 0.1s infinite; /* 極速閃爍 */
        }

        .container {
            text-align: center;
            z-index: 10;
            animation: shake 0.1s infinite; /* 全力震動 */
        }

        h1 {
            font-size: 3rem;
            text-shadow: 0 0 10px #00ff00;
        }

        #timer {
            font-size: 6rem;
            margin: 20px 0;
            animation: pulse 0.5s infinite;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border: 5px solid #00ff00;
        }

        .danmu {
            position: fixed;
            color: #00ff00;
            font-size: 2rem;
            white-space: nowrap;
            pointer-events: none;
            z-index: 1;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dino 被綠至今：</h1>
        <div id="timer">計算中...</div>
        <h1 style="color: white; background: red;">悲 報 確 定</h1>
    </div>

    <script>
        // 設定起始時間：2026年3月19日
        const startDate = new Date('2026-03-19T00:00:00');

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            const ms = Math.floor((diff % 1000) / 10); // 顯示毫秒更鬼畜

            document.getElementById('timer').innerHTML = 
                `${days}天 ${hours}:${minutes}:${seconds}.${ms}`;
        }

        // 彈幕功能
        const texts = ["Dino 堅強", "要想生活過得去", "頭上總得帶點綠", "大草原", "愛是一道光", "又過了一秒", "悲哀", "慘", "Green"];
        function createDanmu() {
            const div = document.createElement('div');
            div.className = 'danmu';
            div.innerText = texts[Math.floor(Math.random() * texts.length)];
            div.style.top = Math.random() * 100 + 'vh';
            div.style.left = '100vw';
            document.body.appendChild(div);

            let pos = 100;
            const interval = setInterval(() => {
                pos -= 2;
                div.style.left = pos + 'vw';
                if (pos < -50) {
                    clearInterval(interval);
                    div.remove();
                }
            }, 20);
        }

        setInterval(updateTimer, 50); // 更高頻率更新
        setInterval(createDanmu, 300); // 瘋狂產生彈幕
    </script>
</body>
</html>
